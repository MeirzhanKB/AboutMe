<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Мейржан — Разработчик</title>
  <meta name="description" content="Мейржан — разработчик: AI-отделы продаж в WhatsApp, боты и сайты для бизнеса.">
  <meta name="theme-color" content="#14162B">
  <!-- link preview in WhatsApp / Telegram / Instagram.
       After buying the domain put the full address in og:url and og:image, e.g. https://meirzhan.kz/og.jpg -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="Мейржан — Разработчик">
  <meta property="og:description" content="AI-отделы продаж, боты и сайты, которые работают 24/7.">
  <meta property="og:image" content="og.jpg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:locale" content="ru_RU">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="icon" type="image/svg+xml" href="favicon.svg?v=1">
  <link rel="apple-touch-icon" href="favicon.png?v=1">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Roboto+Flex:opsz,wdth,wght@8..144,25..151,300..1000&display=swap" rel="stylesheet">
  <!-- until the stylesheet arrives show only the page colour (no flash of unstyled content) -->
  <style>html{background:#14162B}body{visibility:hidden}</style>
  <link rel="stylesheet" href="main.css?v=52">
  <link rel="stylesheet" href="demo.css?v=52">
  <link rel="stylesheet" href="blocks.css?v=52">
</head>
<body>

  <!-- Header -->
  <header class="hd" id="header">
    <a href="#top" class="hd-name"><b id="hdName"></b><span id="hdRole"></span></a>
    <a href="#top" class="hd-mark" aria-label="MK"><svg viewBox="0 0 124 92" aria-hidden="true"><g transform="translate(19 0) skewX(-12)" fill="none" stroke="currentColor" stroke-width="13" stroke-linejoin="miter"><path d="M14 84 V10 L40 50 L66 10 V84"/><path d="M66 52 L101 10"/><path d="M79 38 L106 84"/></g></svg></a>
    <nav class="hd-right">
      <div class="lang" role="group" aria-label="Language"><button data-lang="ru">RU</button><button data-lang="kz">KZ</button><button data-lang="en">EN</button></div>
      <a href="#contact" class="hd-cta" data-ui="cta"></a>
    </nav>
  </header>

  <main>
    <!-- 1. Hero — poster with the name, helmet under the cursor; on scroll it shrinks into a card over the marquee -->
    <section class="intro" id="top" data-theme="dark">
      <div class="intro-pin">
        <span class="label mq-cap" id="mqCap"></span>
        <div class="mq-rows">
          <div class="mq-row mq-1"><div class="mq-track" id="mq1"></div></div>
          <div class="mq-row mq-2"><div class="mq-track rev" id="mq2"></div></div>
        </div>
        <div class="hero-card" id="heroCard">
          <canvas class="hero-lines" id="heroLines" aria-hidden="true"></canvas>
          <div class="hero-glow" aria-hidden="true"></div>
          <div class="hero-giant" id="heroGiant" aria-hidden="true"></div>
          <div class="hero-portrait" id="heroPortrait">
            <img class="hp" id="hpBase" alt="">
            <canvas class="hp" id="altCanvas" aria-hidden="true"></canvas>
          </div>
          <div class="hero-left" id="heroLeft">
            <h1 class="h-title" id="heroTitle"></h1>
            <p class="hero-lead" id="heroLead"></p>
          </div>
          <div class="hero-right" id="heroRight">
            <span class="status"><i></i><span id="heroStatus"></span></span>
            <span class="hero-hint" id="heroHint"></span>
          </div>
        </div>
        <span class="sig sig-hero" id="sigHero" aria-hidden="true"></span>
      </div>
    </section>

    <!-- 2. About -->
    <section class="about" id="about" data-theme="dark">
      <span class="label" id="aboutLabel" data-reveal></span>
      <div class="about-body">
        <p class="about-text" id="aboutText" data-reveal></p>
        <div class="facts" id="aboutFacts"></div>
        <p class="hobby" id="aboutHobby" data-reveal></p>
      </div>
    </section>

    <!-- 3. Projects — dark "hall of fame" grid with filters -->
    <section class="projects" id="projects" data-theme="dark">
      <h2 class="sec-title mixed center" id="projTitle" data-reveal></h2>
      <div class="pfilters" id="pfilters" role="tablist"></div>
      <div class="pgrid" id="pgrid"></div>
    </section>

    <!-- 4. Live demo of the AI sales manager (demo.js) -->
    <section class="demo" id="demo" data-theme="dark">
      <div class="dm-text">
        <span class="eyebrow" id="dmEyebrow" data-reveal></span>
        <h2 class="sec-title mixed" id="dmTitle" data-reveal></h2>
        <p class="dm-p" id="dmText" data-reveal></p>
        <div class="dm-crm" data-reveal>
          <div class="dm-crm-head"><span class="dm-led"></span><span id="dmCrmTitle"></span></div>
          <div id="dmCrm"></div>
        </div>
        <div class="dm-stats" id="dmStats" data-reveal></div>
        <small class="dm-note" id="dmNote"></small>
      </div>
      <div class="dm-phone" data-reveal>
        <div class="dm-screen">
          <div class="dm-top">
            <span class="dm-ava">AA</span>
            <div><b class="dm-name"></b><small class="dm-sub"></small></div>
          </div>
          <div class="dm-body" data-lenis-prevent></div>
          <div class="dm-chips"></div>
          <form class="dm-input" autocomplete="off">
            <input type="text" maxlength="120" aria-label="Message">
            <button type="submit" aria-label="Send"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12l16-8-6 16-2-6z"/></svg></button>
          </form>
        </div>
      </div>
    </section>
  </main>

  <!-- 5. Footer — "Always in the game" -->
  <footer class="footer" id="contact" data-theme="dark">
    <div class="foot-panel">
      <div class="foot-title-wrap">
        <h2 class="foot-title mixed" id="footTitle"></h2>
        <span class="sig sig-foot" data-draw></span>
      </div>
      <div class="foot-col foot-left">
        <span class="eyebrow" data-ui="pages"></span>
        <nav id="footPages"></nav>
      </div>
      <div class="foot-col foot-right">
        <span class="eyebrow" data-ui="follow"></span>
        <nav id="footSocial"></nav>
      </div>
      <div class="foot-logos"><div class="mq-track" id="footLogos"></div></div>
      <div class="foot-portrait"><img id="fpImg" alt=""></div>
      <div class="foot-cta">
        <a class="btn js-mail"><span data-ui="business"></span><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3 13L13 3M6 3h7v7" fill="none" stroke="currentColor" stroke-width="1.8"/></svg></a>
      </div>
      <div class="foot-tab foot-tab-l"><span>© <span id="year"></span> <span id="footName"></span></span> <a class="js-mail-text"></a></div>
      <div class="foot-tab foot-tab-r"><span id="footLoc"></span></div>
    </div>
  </footer>

  <script src="config.js?v=52"></script>
  <script src="https://unpkg.com/lenis@1.1.13/dist/lenis.min.js"></script>
  <script src="main.js?v=52"></script>
  <script src="demo.js?v=52"></script>
</body>
</html>
